# 逻辑变动: 保留单端口代理并开放 Redis Cluster 各节点直连端口-20261002-2010-01
apiVersion: v1
kind: Service
metadata:
  name: redis-external-0
  namespace: redis
  annotations:
    metallb.io/allow-shared-ip: redis-cluster-direct
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.10.205
  externalTrafficPolicy: Cluster
  selector:
    statefulset.kubernetes.io/pod-name: redis-cluster-0
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
