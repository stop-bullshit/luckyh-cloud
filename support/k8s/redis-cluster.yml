apiVersion: v1
kind: Namespace
metadata:
  name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: redis
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: redis-cluster
  ports:
    - name: redis
      port: 6379
    - name: bus
      port: 16379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: redis
spec:
  selector:
    app: redis-cluster
  ports:
    - name: redis
      port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-node-0
  namespace: redis
spec:
  selector:
    statefulset.kubernetes.io/pod-name: redis-cluster-0
  ports:
    - name: redis
      port: 6379
    - name: bus
      port: 16379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-node-1
  namespace: redis
spec:
  selector:
    statefulset.kubernetes.io/pod-name: redis-cluster-1
  ports:
    - name: redis
      port: 6379
    - name: bus
      port: 16379
    - name: redis-announce
      port: 6380
      targetPort: 6379
---
