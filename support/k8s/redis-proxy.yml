apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-proxy-config
  namespace: redis
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: redis-api
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 6379
          filter_chains:
            - filters:
                - name: envoy.filters.network.redis_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.redis_proxy.v3.RedisProxy
                    stat_prefix: redis_api
                    settings:
                      op_timeout: 5s
                      enable_redirection: true
                      dns_cache_config:
                        name: redis_redirection_cache
                        dns_lookup_family: V4_ONLY
                        max_hosts: 100
                    prefix_routes:
                      catch_all_route:
                        cluster: redis_backend
                    downstream_auth_passwords:
                      - filename: /etc/redis-auth/password
      clusters:
        - name: redis_backend
          connect_timeout: 1s
          dns_lookup_family: V4_ONLY
          lb_policy: CLUSTER_PROVIDED
          cluster_type:
            name: envoy.clusters.redis
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.clusters.redis.v3.RedisClusterConfig
              cluster_refresh_rate: 5s
              cluster_refresh_timeout: 3s
              redirect_refresh_interval: 1s
              redirect_refresh_threshold: 1
          load_assignment:
            cluster_name: redis_backend
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: redis-node-0.redis.svc.cluster.local
                          port_value: 6379
                  - endpoint:
                      address:
                        socket_address:
                          address: redis-node-1.redis.svc.cluster.local
                          port_value: 6380
                  - endpoint:
                      address:
                        socket_address:
                          address: redis-node-2.redis.svc.cluster.local
                          port_value: 6381
          typed_extension_protocol_options:
            envoy.filters.network.redis_proxy:
              "@type": type.googleapis.com/envoy.extensions.filters.network.redis_proxy.v3.RedisProtocolOptions
              auth_password:
                filename: /etc/redis-auth/password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-proxy
  namespace: redis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redis-proxy
  template:
    metadata:
      labels:
        app: redis-proxy
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: redis-proxy
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.39.1
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warning"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/envoy/envoy.yaml
              subPath: envoy.yaml
              readOnly: true
            - name: redis-auth
              mountPath: /etc/redis-auth
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: redis-proxy-config
        - name: redis-auth
          secret:
            secretName: redis-auth
---
apiVersion: v1
kind: Service
metadata:
  name: redis-api
  namespace: redis
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.10.202
  selector:
    app: redis-proxy
  ports:
    - name: redis
      port: 6379
      targetPort: redis
