# 初始每个应用仅一个副本；增加节点内存后再扩副本。
apiVersion: v1
kind: Namespace
metadata:
  name: luckyh-cloud
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-runtime-config
  namespace: luckyh-cloud
data:
  NACOS_SERVER_ADDR: nacos.nacos.svc.cluster.local:8848
  NACOS_NAMESPACE: luckyh-cloud-k8s
  NACOS_GROUP: DEFAULT_GROUP
  SEATA_NACOS_SERVER_ADDR: nacos.nacos.svc.cluster.local:8848
  DB_HOST: 192.168.10.209
  DB_PORT: "3306"
  SPRING_DATA_REDIS_HOST: redis-api.redis.svc.cluster.local
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_RABBITMQ_HOST: rabbitmq.rabbitmq.svc.cluster.local
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 25s
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS: never
  JAVA_TOOL_OPTIONS: >-
    -Xms64m -Xmx192m -XX:MaxMetaspaceSize=160m -XX:MaxDirectMemorySize=64m
    -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: luckyh-cloud
  labels:
    app: gateway-service
    app.kubernetes.io/part-of: luckyh-cloud
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
        app.kubernetes.io/part-of: luckyh-cloud
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [k8s-node-02]
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: luckyh-cloud
      containers:
        - name: app
          image: ghcr.io/stop-bullshit/luckyh-gateway-service:sha-7a4e0469efb6cf107171606fdd7fd312d432ff75
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-runtime-config
            - secretRef:
                name: app-runtime
          env:
            - name: SPRING_CLOUD_NACOS_DISCOVERY_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 640Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: luckyh-cloud
spec:
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
