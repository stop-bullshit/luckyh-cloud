apiVersion: v1
kind: Namespace
metadata:
  name: seata
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seata-server-config
  namespace: seata
data:
  file-appender.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!--
      ~  Copyright 1999-2019 Seata.io Group.
      ~
      ~  Licensed under the Apache License, Version 2.0 (the "License");
      ~  you may not use this file except in compliance with the License.
      ~  You may obtain a copy of the License at
      ~
      ~       http://www.apache.org/licenses/LICENSE-2.0
      ~
      ~  Unless required by applicable law or agreed to in writing, software
      ~  distributed under the License is distributed on an "AS IS" BASIS,
      ~  WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
      ~  See the License for the specific language governing permissions and
      ~  limitations under the License.
      -->

    <included>
        <!-- file-appender properties -->
        <springProperty name="LOG_FILE_PATH" source="logging.file.path"
                        defaultValue="${user.home}/logs/seata"/>
        <springProperty name="FILE_LOG_PATTERN" source="logging.pattern.file"
                        defaultValue="%d{yyyy-MM-dd HH:mm:ss.SSS} %5p --- [%t] [%logger] [%M] [%X{X-TX-XID:-}]: %m%n%wEx2"/>

        <!--ALL-->
        <appender name="FILE_ALL" class="ch.qos.logback.core.rolling.RollingFileAppender">
            <file>${LOG_FILE_PATH}/${APPLICATION_NAME:-seata-server}.${RPC_PORT}.all.log</file>
            <append>true</append>
            <rollingPolicy class="ch.qos.logback.core.rolling.SizeAndTimeBasedRollingPolicy">
                <fileNamePattern>${LOG_FILE_PATH}/history/${APPLICATION_NAME:-seata-server}.${RPC_PORT}.all.%d{yyyy-MM-dd}.%i.log.gz</fileNamePattern>
                <maxFileSize>50MB</maxFileSize>
                <MaxHistory>7</MaxHistory>
                <totalSizeCap>200MB</totalSizeCap>
                <cleanHistoryOnStart>true</cleanHistoryOnStart>
            </rollingPolicy>
            <encoder>
                <Pattern>${FILE_LOG_PATTERN}</Pattern>
                <charset>UTF-8</charset>
            </encoder>
        </appender>

        <!--WARN-->
        <appender name="FILE_WARN" class="ch.qos.logback.core.rolling.RollingFileAppender">
            <filter class="ch.qos.logback.classic.filter.LevelFilter">
                <level>WARN</level>
                <onMatch>ACCEPT</onMatch>
                <onMismatch>DENY</onMismatch>
            </filter>
            <file>${LOG_FILE_PATH}/${APPLICATION_NAME:-seata-server}.${RPC_PORT}.warn.log</file>
            <append>true</append>
            <rollingPolicy class="ch.qos.logback.core.rolling.SizeAndTimeBasedRollingPolicy">
                <fileNamePattern>${LOG_FILE_PATH}/history/${APPLICATION_NAME:-seata-server}.${RPC_PORT}.warn.%d{yyyy-MM-dd}.%i.log.gz</fileNamePattern>
                <maxFileSize>50MB</maxFileSize>
                <MaxHistory>7</MaxHistory>
                <totalSizeCap>200MB</totalSizeCap>
                <cleanHistoryOnStart>true</cleanHistoryOnStart>
            </rollingPolicy>
            <encoder>
                <Pattern>${FILE_LOG_PATTERN}</Pattern>
                <charset>UTF-8</charset>
            </encoder>
        </appender>

        <!--ERROR-->
        <appender name="FILE_ERROR" class="ch.qos.logback.core.rolling.RollingFileAppender">
            <filter class="ch.qos.logback.classic.filter.LevelFilter">
                <level>ERROR</level>
                <onMatch>ACCEPT</onMatch>
                <onMismatch>DENY</onMismatch>
            </filter>
            <file>${LOG_FILE_PATH}/${APPLICATION_NAME:-seata-server}.${RPC_PORT}.error.log</file>
            <append>true</append>
            <rollingPolicy class="ch.qos.logback.core.rolling.SizeAndTimeBasedRollingPolicy">
                <fileNamePattern>${LOG_FILE_PATH}/history/${APPLICATION_NAME:-seata-server}.${RPC_PORT}.error.%d{yyyy-MM-dd}.%i.log.gz</fileNamePattern>
                <maxFileSize>50MB</maxFileSize>
                <MaxHistory>7</MaxHistory>
                <totalSizeCap>200MB</totalSizeCap>
                <cleanHistoryOnStart>true</cleanHistoryOnStart>
            </rollingPolicy>
            <encoder>
                <Pattern>${FILE_LOG_PATTERN}</Pattern>
                <charset>UTF-8</charset>
            </encoder>
        </appender>
    </included>
  application.yml: |
    server:
      port: 7091
    spring:
      application:
        name: seata-server
    logging:
      config: classpath:logback-spring.xml
      file:
        path: /root/logs/seata
    console:
      user:
        username: seata
        password: ${SEATA_CONSOLE_PASSWORD}
    seata:
      transport:
        # 演示环境与四个客户端同步关闭固定读空闲检测，RPC 超时继续生效。
        heartbeat: false
      config:
        type: file
      registry:
        type: file
      server:
        service-port: 8091
      store:
        mode: db
        db:
          datasource: druid
          db-type: mysql
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://192.168.10.209:3306/seata?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
          user: ${DB_USERNAME}
          password: ${DB_PASSWORD}
          min-conn: 1
          max-conn: 5
          global-table: global_table
          branch-table: branch_table
          lock-table: lock_table
          distributed-lock-table: distributed_lock
      security:
        secretKey: ${SEATA_SECRET_KEY}
        tokenValidityInMilliseconds: 1800000
        ignore:
          urls: /,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.jpeg,/**/*.ico,/api/v1/auth/login,/metadata/v1/**
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seata-server
  namespace: seata
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seata-server
  template:
    metadata:
      labels:
        app: seata-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-node-01
      containers:
        - name: seata-server
          image: docker.io/seataio/seata-server:2.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SEATA_IP
              value: 192.168.10.203
            - name: SEATA_PORT
              value: "8091"
            - name: STORE_MODE
              value: db
            - name: JVM_XMS
              value: 128m
            - name: JVM_XMX
              value: 256m
            - name: JVM_MetaspaceSize
              value: 96m
            - name: JVM_MaxMetaspaceSize
              value: 160m
            - name: JVM_MaxDirectMemorySize
              value: 128m
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: seata-runtime-credentials
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seata-runtime-credentials
                  key: DB_PASSWORD
            - name: SEATA_CONSOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seata-runtime-credentials
                  key: SEATA_CONSOLE_PASSWORD
            - name: SEATA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seata-runtime-credentials
                  key: SEATA_SECRET_KEY
          ports:
            - name: service
              containerPort: 8091
            - name: console
              containerPort: 7091
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: service
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: service
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: service
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /seata-server/resources/application.yml
              subPath: application.yml
              readOnly: true
            - name: config
              mountPath: /seata-server/resources/logback/file-appender.xml
              subPath: file-appender.xml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: seata-server-config
---
apiVersion: v1
kind: Service
metadata:
  name: seata-server
  namespace: seata
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.10.203
  selector:
    app: seata-server
  ports:
    - name: service
      port: 8091
      targetPort: service
---
apiVersion: v1
kind: Service
metadata:
  name: seata-console
  namespace: seata
spec:
  type: ClusterIP
  selector:
    app: seata-server
  ports:
    - name: console
      port: 7091
      targetPort: console
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seata-console
  namespace: seata
spec:
  ingressClassName: nginx
  rules:
    - host: seata.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seata-console
                port:
                  number: 7091
