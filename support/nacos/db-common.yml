# 公共配置文件 - db-common.yml
# 需要在Nacos配置中心创建
# Data ID: db-common.yml
# Group: DEFAULT_GROUP

# 逻辑变动: 数据库连接参数统一由Nacos公共配置维护-20261002-1740-01
# 数据库公共连接参数；各服务只通过 luckyh.datasource.database 选择自己的库。
luckyh:
  datasource:
    host: '${DB_HOST:192.168.10.209}'
    port: '${DB_PORT:3306}'
    username: '${DB_USERNAME:root}'
    password: '${DB_PASSWORD:admin123+.0}'
    parameters: 'useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true'
  redis:
    # 逻辑变动: 保留代理默认地址并集中维护直连 Redis Cluster 的节点列表-20261002-2035-01
    cluster-nodes: 'redis-node-0.redis.svc.cluster.local:6379,redis-node-1.redis.svc.cluster.local:6380,redis-node-2.redis.svc.cluster.local:6381,redis-node-3.redis.svc.cluster.local:6382,redis-node-4.redis.svc.cluster.local:6383,redis-node-5.redis.svc.cluster.local:6384'

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: 'jdbc:mysql://${luckyh.datasource.host}:${luckyh.datasource.port}/${luckyh.datasource.database:luckyh_cloud}?${luckyh.datasource.parameters}'
    username: '${luckyh.datasource.username}'
    password: '${luckyh.datasource.password}'
  data:
    redis:
      # 逻辑变动: 本地服务通过单端口代理连接 Redis Cluster-20261002-1913-02
      # 逻辑变动: Redis 代理和 RabbitMQ AMQP 使用本地域名-20261002-2015-01
      host: redis-api.home
      port: 6379
      password: '${REDIS_PASSWORD}'
  rabbitmq:
    host: rabbit-api.home
    port: 5672
    username: admin
    password: '${RABBITMQ_PASSWORD}'

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
